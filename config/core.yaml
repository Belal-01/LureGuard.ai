# LureGuard Core — ML scoring + honeypot redirect (agent analysis uses opencode + .env)

thresholds:
  t1: 0.55
  t2: 0.85

policy:
  min_attempts_for_alert: 8

cowrie_profiles:
  dev-server:
    host: cowrie-dev
    port: 2222
  db-server:
    host: cowrie-db
    port: 2223

window_seconds: 300

# STO-1: days to keep events partitions before DROP TABLE.
retention_days: 90
